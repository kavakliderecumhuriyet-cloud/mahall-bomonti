/* ---- background video playlist: add more files here (bomonti2.mp4, bomonti3.mp4 …) ---- */
const BG_VIDEOS = ['bomonti.mp4', 'bomonti2.mp4'];
(function bgPlaylist() {
  const A = document.getElementById('bgA'), B = document.getElementById('bgB');
  if (!A || !B) return;
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let list = BG_VIDEOS.slice(), i = 0, cur = A, nxt = B;
  A.classList.add('on');
  const prep = () => { if (list.length < 2) { cur.loop = true; return; } nxt.src = list[(i + 1) % list.length]; nxt.load(); };
  const swap = () => {
    if (list.length < 2) { cur.currentTime = 0; cur.play().catch(() => {}); return; }
    i = (i + 1) % list.length;
    nxt.currentTime = 0;
    nxt.play().catch(() => {});
    nxt.classList.add('on'); cur.classList.remove('on');
    const t = cur; cur = nxt; nxt = t;
    setTimeout(() => { cur.onended = swap; prep(); }, 1300);
  };
  const onErr = (e) => { if (e.target !== nxt) return; const bad = (i + 1) % list.length; list.splice(bad, 1); if (i >= list.length) i = 0; prep(); };
  A.onerror = onErr; B.onerror = onErr;
  A.onended = swap;
  prep();
  A.play().catch(() => {});
})();
render();
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);
